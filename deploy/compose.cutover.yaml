# One-time SQLite → PostgreSQL cutover (MAZ-65). Adds a `cutover` one-shot service to
# deploy/compose.yaml for the snapshot and import commands. Use it only during the
# cutover window, then stop passing this file. The checklist is docs/cutover.md.
#
#   export PENNY_LEGACY_VOLUME=penny_penny-data   # the legacy volume: docker volume ls
#   cutover="docker compose -f deploy/compose.yaml -f deploy/compose.cutover.yaml"
#   $cutover run --rm --entrypoint sh cutover -c 'cp /var/lib/penny/legacy/penny.sqlite /var/lib/penny/cutover/source.sqlite && sha256sum /var/lib/penny/cutover/source.sqlite'
#   $cutover run --rm cutover snapshot-sqlite /var/lib/penny/cutover/source.sqlite /var/lib/penny/cutover/sealed.sqlite
#   $cutover run --rm cutover import-sqlite /var/lib/penny/cutover/sealed.sqlite --sha256 HASH --dry-run
#
# The legacy database is in WAL mode, which SQLite cannot open from a read-only mount,
# so the cleanly closed file (no -wal after Node's SIGTERM) is copied before sealing.
#
# `cutover` is the only service that gets both the migration credentials (the importer
# needs an owner of the schema) and the receipt key and volume (it encrypts receipt
# BLOBs into the store). It also mounts the legacy volume read-only, so nothing here
# can change the rollback source. Sealed snapshots go to `penny-cutover`, which stays
# until you remove it after the observation window.

services:
  cutover:
    profiles: [cutover]
    image: ${PENNY_API_IMAGE:-ghcr.io/mfalicoff/penny-api:latest}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [penny]
    environment:
      ConnectionStrings__Migration: >-
        Host=${PENNY_DB_HOST:-postgres};Port=${PENNY_DB_PORT:-5432};Database=${PENNY_DB_NAME:-penny};SSL Mode=${PENNY_DB_SSL_MODE:-Disable}${PENNY_DB_OPTIONS:-};Username=${PENNY_MIGRATION_USER:-penny_migrator};Password=${PENNY_MIGRATION_PASSWORD:?run deploy/init-env.sh first}
      Receipts__MasterKey: ${PENNY_RECEIPT_KEY:?run deploy/init-env.sh first}
    volumes:
      - penny-receipts:/var/lib/penny/receipts
      - penny-cutover:/var/lib/penny/cutover
      - legacy-data:/var/lib/penny/legacy:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

volumes:
  # Holds the sealed snapshots. The image creates the mount point owned by the API user.
  penny-cutover:
  # The legacy Node/SQLite data volume (penny.sqlite), never written here.
  legacy-data:
    external: true
    name: ${PENNY_LEGACY_VOLUME:?set PENNY_LEGACY_VOLUME to the legacy penny-data volume (docker volume ls)}
