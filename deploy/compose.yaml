# Penny self-hosting stack (MAZ-63): pinned PostgreSQL 18, the .NET API (it migrates
# the database on startup) and the nginx web front end on one origin.
#
#   cp .env.example .env   # once: set the origin and secrets (chmod 600)
#   docker compose up -d --wait
#
# Self-contained: this file, .env and the optional api.env are all a server needs (no
# checkout, no scripts). The API creates and upgrades its schema itself. To build the images
# from a checkout instead, add `-f deploy/compose.build.yaml`.
#
# Only `web` publishes a port. The API and PostgreSQL are reachable only on
# the internal network. Secrets come from .env (and api.env) and are passed only to the
# services that need them. See docs/self-hosting/deployment.md.
#
# External PostgreSQL: set COMPOSE_PROFILES= (empty), PENNY_DB_HOST/PORT/NAME,
# PENNY_DB_SSL_MODE=VerifyFull, PENNY_DB_OPTIONS and the login (PENNY_DB_USER/
# PENNY_DB_PASSWORD) in .env; the bundled `postgres` is not started.

name: penny

services:
  postgres:
    profiles: [bundled-postgres]
    # PostgreSQL 18.6 with pgvector 0.8.7: the digest pinned in apps/backend/compose.yaml
    # and DatabaseSchema.Image. Upgrades follow docs/self-hosting/deployment.md#upgrade-postgresql.
    image: docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_DB: ${PENNY_DB_NAME:-penny}
      # Only used to initialize an empty volume: this login owns the database (and, in
      # this dedicated container, may create the search extensions).
      POSTGRES_USER: ${PENNY_DB_USER:-penny}
      POSTGRES_PASSWORD: ${PENNY_DB_PASSWORD:?set it in deploy/.env (see deploy/.env.example)}
    volumes:
      - penny-postgres:/var/lib/postgresql
    shm_size: 256m
    healthcheck:
      # Over TCP: on first start the image initializes on a socket-only server and then
      # restarts, so a socket check would pass before the real server is up and
      # the API could connect into the restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [penny]

  # Applies pending migrations on startup, before it serves (docs/self-hosting/deployment.md).
  api:
    image: ${PENNY_API_IMAGE:-ghcr.io/mfalicoff/penny-api:latest}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The API with the search model needs about 1 GiB, plus up to Ocr__EngineMemoryMegabytes
    # (default 1024) per receipt extracted at once (Ocr__Concurrency, default 1); past the
    # limit the kernel kills the container and it restarts (docs/self-hosting/operations.md#receipt-text-ocr).
    mem_limit: ${PENNY_API_MEMORY:-3g}
    pids_limit: 1024
    env_file:
      - path: ./api.env
        required: false
    environment:
      ConnectionStrings__Postgres: >-
        Host=${PENNY_DB_HOST:-postgres};Port=${PENNY_DB_PORT:-5432};Database=${PENNY_DB_NAME:-penny};SSL Mode=${PENNY_DB_SSL_MODE:-Disable}${PENNY_DB_OPTIONS:-};Username=${PENNY_DB_USER:-penny};Password=${PENNY_DB_PASSWORD:?set it in deploy/.env (see deploy/.env.example)}
      Receipts__MasterKey: ${PENNY_RECEIPT_KEY:?set it in deploy/.env (see deploy/.env.example)}
      Auth__AllowedOrigins: ${PENNY_PUBLIC_ORIGIN:?set PENNY_PUBLIC_ORIGIN in deploy/.env}
      Auth__SecureCookies: ${PENNY_SECURE_COOKIES:-true}
      # Only the web container talks to the API; trusting its X-Forwarded-For gives
      # rate limits the real client address (nginx replaces, never appends, it).
      Auth__TrustedProxies: ${PENNY_SUBNET:-172.31.63.0/24}
      Backend__ShutdownTimeoutSeconds: "30"
    volumes:
      - penny-receipts:/var/lib/penny/receipts
    # `render` reaches penny-render (emailed receipts, MAZ-184) and nothing else.
    networks: [penny, render]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "dotnet", "Penny.Backend.Api.dll", "health-probe"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Covers a first start or an upgrade that migrates before serving.
      start_period: 120s
    # Above Backend__ShutdownTimeoutSeconds, so in-flight requests and worker leases
    # are released before the container is killed.
    stop_grace_period: 45s
    restart: unless-stopped

  # Emailed receipts (MAZ-184): HTML-to-PDF for received mail, started with
  # COMPOSE_PROFILES=bundled-postgres,email-receipts. Headless Chromium with JavaScript
  # off renders sanitized email HTML. It is attached only to the `render` network,
  # which is internal (no route out): it can't reach the internet, PostgreSQL or the
  # API's other ports. The API calls it; it never calls back. Every URL but its own
  # temporary files is denied inside Chromium too, as a second layer.
  # Flags are pinned by apps/backend/tests/.../RendererIsolationTests.
  penny-render:
    profiles: [email-receipts]
    image: docker.io/gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    command:
      - gotenberg
      - --api-timeout=30s
      - --api-disable-download-from
      - --chromium-disable-javascript
      - --chromium-deny-list=^(?!file:///tmp/).*
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-max-queue-size=4
      - --chromium-restart-after=50
      - --libreoffice-disable-routes
      - --pdfengines-disable-routes
      - --webhook-disable
      - --prometheus-disable-collect
      - --log-level=error
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/gotenberg:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PENNY_RENDER_MEMORY:-1g}
    cpus: ${PENNY_RENDER_CPUS:-1}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks: [render]

  web:
    image: ${PENNY_WEB_IMAGE:-ghcr.io/mfalicoff/penny-web:latest}
    environment:
      PENNY_API_UPSTREAM: api:8080
      PENNY_REAL_IP_FROM: ${PENNY_REAL_IP_FROM:-127.0.0.1/32}
      # Opt-in browser telemetry (MAZ-129): a Faro collector URL, such as Grafana Cloud's.
      PENNY_WEB_TELEMETRY_URL: ${PENNY_WEB_TELEMETRY_URL:-}
    ports:
      - "${PENNY_BIND:-127.0.0.1}:${PENNY_PORT:-8080}:8080"
    read_only: true
    # Writable scratch for the unprivileged nginx user (rendered config, pid, temp).
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: { size: 67108864, mode: 01777 }
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs: { size: 1048576, mode: 01777 }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped
    networks: [penny]

networks:
  penny:
    ipam:
      config:
        - subnet: ${PENNY_SUBNET:-172.31.63.0/24}
  # No route out: penny-render can talk only to the API.
  render:
    internal: true

volumes:
  penny-postgres:
  penny-receipts:
