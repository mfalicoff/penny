<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Create account</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>

  .glow { top: -60px; }
  .wrap { position: relative; z-index: 1; padding: 0 24px; }
  .srv { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 20; height: 36px; font-size: 14px; font-weight: 500; padding: 0 14px; white-space: nowrap; }
  .srv [data-i] { width: 16px; height: 16px; color: var(--label-2); --sw: 40px; }
  .srv em { font-style: normal; color: var(--tint-text); font-weight: 600; margin-left: 4px; }
  .logo { width: 64px; height: 64px; border-radius: 19px; background: var(--tint); color: #fff; display: grid; place-items: center; margin: 0 auto; box-shadow: 0 10px 30px color-mix(in srgb, var(--tint) 35%, transparent); }
  .logo [data-i] { width: 34px; height: 34px; --sw: 36px; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; text-align: center; margin-top: 18px; }
  .lede { font-size: 16px; color: var(--label-2); text-align: center; margin-top: 6px; line-height: 1.35; }
  .fields { background: var(--surface); border-radius: 18px; margin-top: 28px; }
  .f { padding: 10px 16px; position: relative; }
  .f + .f::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--separator); }
  .f label { display: block; font-size: 12px; font-weight: 600; color: var(--label-2); }
  .f div { font-size: 17px; margin-top: 2px; height: 24px; }
  .f .ph { color: var(--label-3); }
  .hint { font-size: 13px; color: var(--label-2); margin: 8px 4px 0; display: flex; align-items: center; gap: 6px; }
  .cta { width: 100%; height: 52px; border-radius: 26px; justify-content: center; font-size: 17px; margin-top: 18px; display: flex; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--label-3); font-size: 13px; margin: 18px 0; }
  .or::before, .or::after { content: ""; flex: 1; border-top: .5px solid var(--separator); }
  .link { text-align: center; font-size: 15px; color: var(--label-2); margin-top: 18px; }
  .link b { color: var(--tint-text); font-weight: 600; }
  .demo { position: absolute; bottom: 44px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 600; color: var(--label); z-index: 1; display: flex; justify-content: center; }
  .demo span { display: inline-flex; align-items: center; gap: 6px; }
  .demo [data-i] { width: 18px; height: 18px; color: var(--tint); }
  .meter { display: flex; gap: 4px; margin: 10px 4px 0; }
  .meter i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); }
  .meter i.on { background: var(--label); }
</style></head>
<body class="canvas">
<div class="iphone">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="scroll">
    <div class="glow"></div>
    <div class="navbar"><div class="glass gbtn"><i data-i="chevron-back"></i></div></div>
    <div class="glass gcap srv" style="top:118px"><i data-i="server"></i>penny.example.com</div>
    <div class="wrap" style="padding-top:184px">
      <h1 style="text-align:left;margin-top:0">Make yourself<br>at home.</h1>
      <p class="lede" style="text-align:left">Your account lives on this server. Penny never connects to your bank.</p>
      <div class="fields">
        <div class="f"><label>Email</label><div>max@example.com</div></div>
        <div class="f"><label>Password</label><div>••••••••••••</div></div>
      </div>
      <div class="meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <p class="hint"><i data-i="checkmark" style="width:15px;height:15px;--sw:56px"></i>At least 10 characters</p>
      <div class="glass gcap tinted cta" style="margin-top:26px">Create account</div>
      <p class="link">Already have an account? <b>Sign in</b></p>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
