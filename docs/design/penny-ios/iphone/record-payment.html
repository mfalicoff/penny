<!-- @dsCard group="iPhone" name="Shared · record payment" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Record payment</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .mono { background: linear-gradient(180deg, #A8A29E, #78716C); }
  .behind { position: absolute; inset: 0; background: var(--bg); }
  .behind .ghost { position: absolute; left: 16px; right: 16px; border-radius: 26px; background: var(--surface); }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 520px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .xfer { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 26px; }
  .person { text-align: center; font-size: 14px; font-weight: 600; }
  .person .avatar { width: 64px; height: 64px; font-size: 22px; border: 0; margin: 0 auto 6px; }
  .person span { display: block; font-size: 12px; color: var(--label-2); font-weight: 500; }
  .arrow { display: flex; align-items: center; color: var(--label-3); margin-bottom: 26px; }
  .arrow i.line { display: block; width: 46px; border-top: 2px dashed var(--label-3); }
  .arrow [data-i] { width: 18px; height: 18px; transform: rotate(90deg); margin-left: -6px; --sw: 48px; }
  .amt { text-align: center; font-size: 48px; font-weight: 700; letter-spacing: -0.04em; margin-top: 18px; }
  .ctx { text-align: center; font-size: 15px; color: var(--label-2); margin-top: 2px; }
  .lock { display: flex; justify-content: center; margin-top: 10px; }
  .lock span { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 600; color: var(--label-2); background: var(--fill); padding: 4px 10px; border-radius: 10px; }
  .lock [data-i] { width: 13px; height: 13px; }
  .note { margin: 22px 22px 0; display: flex; gap: 10px; font-size: 14px; line-height: 19px; color: var(--label-2); }
  .note [data-i] { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .cta { position: absolute; left: 20px; right: 20px; bottom: 34px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .cta [data-i] { width: 20px; height: 20px; }
</style></head>
<body class="canvas">
<div class="iphone">
  <div class="behind"><div class="ghost" style="top:120px;height:180px"></div><div class="ghost" style="top:320px;height:220px"></div></div>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <h2>Record payment</h2>
      <div style="width:44px"></div>
    </div>
    <div class="xfer">
      <div class="person"><div class="avatar mono">JS</div>Jo<span>paid</span></div>
      <div class="arrow"><i class="line"></i><i data-i="arrow-up"></i></div>
      <div class="person"><div class="avatar mono">MF</div>You<span>received</span></div>
    </div>
    <div class="amt num">$61.40</div>
    <div class="ctx">Jo's share of Costco run · Nov 4</div>
    <div class="lock"><span><i data-i="lock-closed"></i>Full share</span></div>
    <div class="note"><i data-i="checkmark-circle"></i><span>Record this once Jo has paid you outside Penny. Penny keeps track — it doesn't send money, and nobody's spending changes.</span></div>
    <div class="cta glass tinted"><i data-i="checkmark"></i>Mark $61.40 as paid</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
