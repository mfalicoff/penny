<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Split</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 300px; bottom: 6px; border-radius: 44px; background: var(--bg); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; text-align: center; }
  .bar h2 span { display: block; font-size: 13px; font-weight: 500; color: var(--label-2); }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .segwrap { margin: 16px 14px 0; }
  .list { margin: 14px 14px 0; }
  .stp { display: flex; align-items: center; padding: 0 16px; height: 56px; font-size: 16px; }
  .stp .s { margin-left: auto; display: flex; align-items: center; background: var(--fill); border-radius: 10px; height: 34px; }
  .stp .s div { width: 46px; display: grid; place-items: center; font-size: 22px; font-weight: 400; }
  .stp .s div + div { border-left: .5px solid var(--separator); }
  .stp b { font-size: 20px; font-weight: 700; margin: 0 14px; min-width: 14px; text-align: center; }
  .res { margin: 14px 14px 0; padding: 18px; text-align: center; }
  .res span { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .04em; }
  .res b { display: block; font-size: 44px; font-weight: 700; letter-spacing: -0.04em; margin-top: 4px; }
  .res p { font-size: 14px; color: var(--label-2); margin-top: 6px; }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="add-expense.html" scrolling="no"></iframe>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <h2>Split<span class="num">Dinner with friends · $74.40</span></h2>
      <div class="gbtn glass tinted"><i data-i="checkmark"></i></div>
    </div>
    <div class="segwrap"><div class="seg"><div>All mine</div><div class="on">Equally</div><div>Amount</div><div>Percent</div></div></div>
    <div class="list">
      <div class="stp">People, including you<div class="s"><div>−</div><b class="num">3</b><div>+</div></div></div>
    </div>
    <div class="card res">
      <span>Your share</span>
      <b class="num">$24.80</b>
      <p>Only your share counts toward your spending.<br>The $74.40 total stays on the entry.</p>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
