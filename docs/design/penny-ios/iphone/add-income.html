<!-- @dsCard group="iPhone" name="Add income" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Add income</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 62px; bottom: 6px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .wrap { padding: 0 18px; }
  .amount { text-align: center; padding: 22px 0 4px; }
  .amount .v { font-size: 60px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.05; color: var(--income); }
  .amount .v .cur { opacity: .45; }
  .amount .cad { display: inline-flex; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--label-2); background: var(--fill); padding: 4px 10px; border-radius: 10px; }
  .note { margin: 16px 0 0; height: 46px; border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; padding: 0 14px; font-size: 17px; }
  .cats { display: flex; gap: 8px; margin-top: 12px; }
  .cats .pill.on { background: var(--income); color: #fff; }
  .opts { margin-top: 12px; border-radius: 16px; background: var(--surface-2); }
  .opt { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 16px; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; border-top: .5px solid var(--separator); }
  .opt [data-i] { width: 20px; height: 20px; color: var(--label-2); }
  .opt .v { margin-left: auto; color: var(--label-2); display: flex; align-items: center; gap: 4px; }
  .hint { display: flex; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--pending) 12%, transparent); font-size: 14px; line-height: 1.4; color: var(--label); }
  .hint [data-i] { width: 18px; height: 18px; color: var(--pending); margin-top: 1px; }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="home.html" scrolling="no"></iframe>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <div class="seg" style="width:236px"><div>Expense</div><div class="on">Income</div><div>Invest</div></div>
      <div class="gbtn glass tinted"><i data-i="checkmark"></i></div>
    </div>
    <div class="wrap">
      <div class="amount">
        <div class="v num"><span class="cur">+$</span>2,250.00</div>
        <span class="cad">CAD</span>
      </div>
      <div class="note">Payday</div>
      <div class="cats">
        <span class="pill on"><i data-i="briefcase"></i>Salary</span>
        <span class="pill"><i data-i="laptop"></i>Freelance</span>
        <span class="pill"><i data-i="gift"></i>Gifts</span>
        <span class="pill"><i data-i="ellipsis-horizontal"></i></span>
      </div>
      <div class="opts">
        <div class="opt"><i data-i="calendar"></i>Date<span class="v">Sun, Nov 15</span></div>
        <div class="opt"><i data-i="wallet"></i>Account<span class="v">Main chequing</span></div>
        <div class="opt"><i data-i="repeat"></i>Repeat<span class="v">Monthly on the 15th <i data-i="chevron-forward" class="chev"></i></span></div>
        <div class="opt"><i data-i="document-text"></i>Note<span class="v" style="color:var(--label-3)">Optional</span></div>
      </div>
      <div class="hint"><i data-i="time"></i><span>Nov 15 is still ahead, so this pay shows as <b>expected</b>. It counts toward Projected until the day it's recorded — not toward Left to spend.</span></div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
