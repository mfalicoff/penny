<!-- @dsCard group="iPhone" name="Shared · add expense" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Add shared expense</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .mono { background: linear-gradient(180deg, #A8A29E, #78716C); }
  .behind { position: absolute; inset: 0; background: var(--bg); }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 62px; bottom: 6px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; text-align: center; line-height: 1.15; }
  .bar h2 span { display: block; font-size: 12px; font-weight: 500; color: var(--label-2); }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .wrap { padding: 0 18px; }
  .amount { text-align: center; padding: 14px 0 0; font-size: 52px; font-weight: 700; letter-spacing: -0.045em; }
  .amount .cur { opacity: .4; }
  .note { margin-top: 10px; height: 44px; border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; padding: 0 14px; font-size: 17px; gap: 10px; }
  .note .pill { margin-left: auto; height: 30px; font-size: 13px; background: color-mix(in srgb, var(--c-home) 14%, transparent); color: var(--c-home); }
  .lbl { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; margin: 16px 2px 8px; display: flex; justify-content: space-between; }
  .payer { display: flex; gap: 8px; }
  .payer .pill { padding-left: 4px; }
  .payer .pill .avatar { width: 26px; height: 26px; font-size: 10px; border: 0; }
  .payer .pill.on { background: var(--label); color: var(--surface); }
  .alloc { border-radius: 16px; background: var(--surface-2); margin-top: 10px; }
  .al { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; position: relative; font-size: 16px; }
  .al + .al::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; border-top: .5px solid var(--separator); }
  .al .avatar { width: 30px; height: 30px; font-size: 11px; border: 0; }
  .al .ck { width: 22px; height: 22px; border-radius: 50%; background: var(--tint); color: #fff; display: grid; place-items: center; }
  .al .ck [data-i] { width: 14px; height: 14px; --sw: 64px; }
  .al .v { margin-left: auto; font-weight: 600; }
  .al .v.me { color: var(--label); }
  .yours { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: var(--fill); font-size: 15px; }
  .yours b { font-size: 20px; font-weight: 700; }
  .opts { margin-top: 12px; border-radius: 16px; background: var(--surface-2); }
  .opt { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; font-size: 16px; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; border-top: .5px solid var(--separator); }
  .opt [data-i] { width: 20px; height: 20px; color: var(--label-2); }
  .opt .v { margin-left: auto; color: var(--label-2); }
</style></head>
<body class="canvas">
<div class="iphone">
  <div class="behind"></div><div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <h2>New expense<span>Apartment</span></h2>
      <div class="gbtn glass tinted"><i data-i="checkmark"></i></div>
    </div>
    <div class="wrap">
      <div class="amount num"><span class="cur">$</span>96.30</div>
      <div class="note">Hydro<span class="pill"><i data-i="home"></i>Home</span></div>

      <div class="lbl"><span>Paid by</span></div>
      <div class="payer">
        <span class="pill"><span class="avatar mono">MF</span>You</span>
        <span class="pill on"><span class="avatar mono">MI</span>Mira</span>
        <span class="pill"><span class="avatar mono">JS</span>Jo</span>
      </div>

      <div class="lbl"><span>Split</span></div>
      <div class="seg"><div class="on">Equally</div><div>Amounts</div><div>Percent</div></div>
      <div class="alloc">
        <div class="al"><span class="ck"><i data-i="checkmark"></i></span><span class="avatar mono">MF</span>You<span class="v num me">$32.10</span></div>
        <div class="al"><span class="ck"><i data-i="checkmark"></i></span><span class="avatar mono">MI</span>Mira<span class="v num">$32.10</span></div>
        <div class="al"><span class="ck"><i data-i="checkmark"></i></span><span class="avatar mono">JS</span>Jo<span class="v num">$32.10</span></div>
      </div>
      <div class="yours"><span>Your share <span style="color:var(--label-2)">· in your spending</span></span><b class="num">$32.10</b></div>
      <div class="opts">
        <div class="opt"><i data-i="calendar"></i>Date<span class="v">Today</span></div>
        <div class="opt"><i data-i="ellipsis-horizontal"></i>Receipt, repeat, note<span class="v"><i data-i="chevron-forward" class="chev"></i></span></div>
      </div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
