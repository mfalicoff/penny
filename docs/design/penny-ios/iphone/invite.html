<!-- @dsCard group="iPhone" name="Invite someone" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Invite someone</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 110px; bottom: 6px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; height: 56px; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .bar .side { width: 86px; display: flex; } .bar .side.r { justify-content: flex-end; }
  .wrap { padding: 0 18px; text-align: center; }
  .lead { font-size: 15px; color: var(--label-2); margin-top: 18px; }
  .code { font-size: 40px; font-weight: 700; letter-spacing: .04em; margin-top: 6px; font-variant-numeric: tabular-nums; font-feature-settings: "tnum", "zero"; }
  .tile { width: 212px; height: 212px; margin: 18px auto 0; border-radius: 26px; background: #fff; padding: 18px; box-shadow: 0 0 0 .5px var(--separator), 0 8px 24px rgba(40, 30, 20, .08); }
  .qr { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(25, 1fr); }
  .qr i { display: block; } .qr i.on { background: #16120F; }
  .exp { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 15px; font-weight: 500; color: var(--label-2); }
  .exp [data-i] { width: 17px; height: 17px; }
  .btns { display: flex; gap: 10px; margin-top: 22px; }
  .b { flex: 1; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 17px; font-weight: 600; background: var(--fill); color: var(--label); }
  .b [data-i] { width: 19px; height: 19px; }
  .b .dn { width: 14px; height: 14px; color: var(--label-2); }
  .quiet { margin-top: 14px; font-size: 16px; font-weight: 600; color: var(--tint-text); display: inline-flex; align-items: center; gap: 6px; }
  .quiet [data-i] { width: 18px; height: 18px; }
  .hint { font-size: 13px; color: var(--label-2); margin: 20px 6px 0; line-height: 18px; text-align: left; }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="shared.html" scrolling="no"></iframe><div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar"><div class="side"></div><h2>Invite someone</h2><div class="side r"><div class="glass gcap tinted">Done</div></div></div>
    <div class="wrap">
      <div class="lead">They enter this code in Shared → Join</div>
      <div class="code">7F3A 9C01 B2</div>
      <div class="tile"><div class="qr" id="qr"></div></div>
      <div class="exp"><i data-i="time"></i>Expires in <span class="num">9:42</span></div>
      <div class="btns">
        <div class="b"><i data-i="copy"></i>Copy</div>
        <div class="b">Share<i data-i="chevron-down" class="dn"></i></div>
      </div>
      <div class="quiet"><i data-i="repeat"></i>New code</div>
      <div class="hint">They open Shared, tap Join with a code, and type or scan it. Everyone uses CAD; new members are included in equal splits from the day they join.</div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
<script>
  // A QR-like 25×25 module grid: three finder squares, timing rows and seeded modules.
  (function (el, n) {
    let seed = 0x7F3A9C01;
    const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
    };
    const cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      let on = finder(r, c, 0, 0) ?? finder(r, c, 0, n - 7) ?? finder(r, c, n - 7, 0);
      if (on === null) {
        const sep = (r <= 7 && c <= 7) || (r <= 7 && c >= n - 8) || (r >= n - 8 && c <= 7);
        on = sep ? false : r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() > .52;
      }
      cells.push(`<i${on ? ' class="on"' : ""}></i>`);
    }
    el.innerHTML = cells.join("");
  })(document.getElementById("qr"), 25);
</script>
</body></html>
