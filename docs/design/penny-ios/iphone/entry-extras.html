<!-- @dsCard group="iPhone" name="Entry · more details" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · More details</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 76px; bottom: 6px; border-radius: 44px; background: var(--bg); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .grp-h { padding: 18px 30px 6px; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; }
  .list { margin: 0 14px; }
  .att { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .thumb { width: 44px; height: 54px; border-radius: 8px; background: #FBFAF7; border: .5px solid var(--separator); padding: 7px 6px; display: flex; flex-direction: column; gap: 4px; flex: none; }
  .thumb i { display: block; height: 3px; border-radius: 2px; background: #D9D5CE; }
  .att .t { flex: 1; } .att b { display: block; font-size: 16px; font-weight: 600; } .att span { font-size: 13px; color: var(--label-2); }
  .rm { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label-2); }
  .rm [data-i] { width: 15px; height: 15px; --sw: 48px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid var(--separator); }
  .btns div { height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--tint-text); }
  .btns div + div { border-left: .5px solid var(--separator); }
  .btns [data-i] { width: 19px; height: 19px; }
  .segwrap { margin: 0 14px; }
  .seg .on { color: var(--label); }
  .sub { padding: 8px 30px 0; font-size: 13px; color: var(--label-2); }
  .opt { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; font-size: 16px; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 48px; right: 0; border-top: .5px solid var(--separator); }
  .opt [data-i] { width: 20px; height: 20px; color: var(--label-2); }
  .opt .ck { margin-left: auto; color: var(--tint); --sw: 48px; }
  .note { margin: 0 14px; border-radius: var(--r-card); background: var(--surface); padding: 14px 16px; height: 84px; font-size: 16px; color: var(--label-3); }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="add-expense.html" scrolling="no"></iframe>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="chevron-back"></i></div>
      <h2>More details</h2>
      <div class="gbtn glass tinted"><i data-i="checkmark"></i></div>
    </div>

    <div class="grp-h">Receipt</div>
    <div class="list">
      <div class="att"><div class="thumb"><i style="width:60%"></i><i></i><i style="width:80%"></i><i></i><i style="width:50%"></i></div><div class="t"><b>receipt.jpg</b><span>Photo · 1.2 MB</span></div><div class="rm"><i data-i="close"></i></div></div>
      <div class="btns"><div><i data-i="image"></i>Photo</div><div><i data-i="document-text"></i>File or PDF</div></div>
    </div>

    <div class="grp-h">Repeat</div>
    <div class="segwrap"><div class="seg"><div class="on">Never</div><div>Weekly</div><div>Monthly</div><div>Yearly</div></div></div>
    <div class="sub">Repeating creates a schedule you can pause in Recurring.</div>

    <div class="grp-h">Trip</div>
    <div class="list">
      <div class="opt"><i data-i="close"></i>No trip<i data-i="checkmark" class="ck"></i></div>
      <div class="opt"><i data-i="airplane"></i>Lisbon trip</div>
      <div class="opt"><i data-i="airplane"></i>Montréal weekend</div>
    </div>

    <div class="grp-h">Note</div>
    <div class="note">Anything you'd like to remember</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
