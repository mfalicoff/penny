  .pb.google { background: #fff; color: #1F1F1F; box-shadow: inset 0 0 0 1px #747775; }

  .steps { background: var(--surface); border-radius: 18px; margin-top: 26px; padding: 4px 0; }
  .st { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; font-size: 15px; line-height: 1.4; position: relative; }

  .st small { display: block; font-size: 13px; color: var(--label-2); margin-top: 2px; }

  .resend b { color: var(--label-3); font-weight: 600; }
