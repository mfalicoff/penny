<!-- @dsCard group="iPhone" name="Category picker" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Category picker</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 76px; bottom: 6px; border-radius: 44px; background: var(--bg); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .search { margin: 14px 16px 0; height: 40px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--label-2); font-size: 16px; }
  .search [data-i] { width: 17px; height: 17px; }
  .grp-h { padding: 20px 28px 10px; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; }
  .grid { margin: 0 14px; padding: 16px 8px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; }
  .c { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; text-align: center; letter-spacing: -0.01em; }
  .c .ic { width: 54px; height: 54px; border-radius: 18px; position: relative; }
  .c .ic [data-i] { width: 26px; height: 26px; }
  .c.on .ic { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--tint); }
  .c.on { font-weight: 700; }
  .c.new .ic { background: transparent; border: 1.5px dashed var(--label-3); color: var(--label-2); }
  .foot { text-align: center; margin-top: 16px; font-size: 16px; font-weight: 500; color: var(--tint-text); }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="add-expense.html" scrolling="no"></iframe>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <h2>Expense category</h2>
      <div style="width:44px"></div>
    </div>
    <div class="search"><i data-i="search"></i>Search categories</div>

    <div class="grp-h">Most used</div>
    <div class="card grid">
      <div class="c on"><div class="ic" style="background:var(--c-food)"><i data-i="cafe"></i></div>Food &amp; drinks</div>
      <div class="c"><div class="ic" style="background:var(--c-groceries)"><i data-i="basket"></i></div>Groceries</div>
      <div class="c"><div class="ic" style="background:var(--c-transport)"><i data-i="bus"></i></div>Transport</div>
      <div class="c"><div class="ic" style="background:var(--c-home)"><i data-i="home"></i></div>Home</div>
    </div>

    <div class="grp-h">All categories</div>
    <div class="card grid">
      <div class="c"><div class="ic" style="background:var(--c-shopping)"><i data-i="bag-handle"></i></div>Shopping</div>
      <div class="c"><div class="ic" style="background:var(--c-entertainment)"><i data-i="musical-notes"></i></div>Entertainment</div>
      <div class="c"><div class="ic" style="background:var(--c-health)"><i data-i="heart"></i></div>Health</div>
      <div class="c"><div class="ic" style="background:var(--c-other)"><i data-i="ellipsis-horizontal"></i></div>Other</div>
      <div class="c new"><div class="ic"><i data-i="add"></i></div>New</div>
    </div>
    <div class="foot">Edit categories</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
