<!-- @dsCard group="iPhone" name="Receipt viewer" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Receipt</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  body.canvas { background: #1b1a19; }
  .iphone { background: #000; }
  .navbar h2 { font-size: 16px; font-weight: 600; color: var(--label); text-align: center; }
  .navbar h2 span { display: block; font-size: 12px; font-weight: 500; color: var(--label-2); }
  .paper { position: absolute; left: 50%; top: 150px; width: 270px; transform: translateX(-50%) rotate(-1.2deg); background: #F7F4EE; color: #2A2622; border-radius: 4px; padding: 22px 20px 26px; font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; line-height: 1.65; box-shadow: 0 20px 50px rgba(0,0,0,.6);
    -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) bottom/12px 9px repeat-x; }
  .paper h3 { text-align: center; font-size: 14px; letter-spacing: .12em; margin-bottom: 4px; }
  .paper .c { text-align: center; color: #6E665D; margin-bottom: 12px; }
  .paper .l { display: flex; justify-content: space-between; }
  .paper hr { border: 0; border-top: 1px dashed #B5ADA2; margin: 10px 0; }
  .paper .tot { font-weight: 700; font-size: 13px; }
  .bottom { position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 10px; align-items: center; z-index: 25; }
  .info { flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 8px; }
  .info .ic { width: 40px; height: 40px; border-radius: 20px; }
  .info .t b { display: block; font-size: 15px; font-weight: 600; }
  .info .t span { font-size: 12.5px; color: var(--label-2); }
  [data-i="wifi"] [stroke="black"] { stroke: currentColor; } [data-i="wifi"] [fill="black"] { fill: currentColor; }
  .zoom { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); font-size: 12px; color: var(--label-2); z-index: 25; }
</style></head>
<body class="canvas">
<div class="iphone dark">
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="navbar">
    <div class="glass gbtn"><i data-i="close"></i></div>
    <h2>receipt.jpg<span>Photo · 1.2 MB</span></h2>
    <div class="grp"><div class="glass gbtn"><i data-i="arrow-up"></i></div><div class="glass gbtn" style="color:var(--danger)"><i data-i="trash"></i></div></div>
  </div>

  <div class="paper">
    <h3>CAFÉ OLIMPICO</h3>
    <div class="c">124 Rue St-Viateur O<br>Nov 9, 2026 · 08:42</div>
    <div class="l"><span>Latte</span><span>5.25</span></div>
    <div class="l"><span>Cappuccino</span><span>4.95</span></div>
    <div class="l"><span>Croissant</span><span>1.25</span></div>
    <hr>
    <div class="l"><span>Subtotal</span><span>11.45</span></div>
    <div class="l"><span>Taxes</span><span>1.35</span></div>
    <hr>
    <div class="l tot"><span>TOTAL</span><span>12.80</span></div>
    <div class="l" style="margin-top:8px"><span>VISA ****4421</span><span>APPROVED</span></div>
    <div class="c" style="margin:14px 0 0">Merci !</div>
  </div>

  <div class="zoom">Pinch to zoom</div>
  <div class="bottom">
    <div class="info glass"><div class="ic" style="background:var(--c-food)"><i data-i="cafe"></i></div><div class="t"><b>Coffee with Mira</b><span class="num">$12.80 total · Mon, Nov 9</span></div></div>
  </div>
  <div class="home-ind" style="background:#fff"></div>
</div>
</body></html>
