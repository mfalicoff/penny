<!-- @dsCard group="iPhone" name="Add expense" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Add expense</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; inset: 0; background: var(--bg); }
  .behind .glow { opacity: .8; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 62px; bottom: 6px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .wrap { padding: 0 18px; }
  .amount { text-align: center; padding: 18px 0 4px; }
  .amount .v { font-size: 60px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.05; }
  .amount .v .cur { opacity: .4; }
  .amount .v .caret { display: inline-block; width: 3px; height: 50px; background: var(--tint); border-radius: 2px; vertical-align: -6px; margin-left: 3px; }
  .amount .cad { display: inline-flex; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--label-2); background: var(--fill); padding: 4px 10px; border-radius: 10px; }
  .note { margin: 14px 0 0; height: 46px; border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; padding: 0 14px; font-size: 17px; }
  .cats { display: flex; gap: 8px; margin-top: 12px; overflow: hidden; }
  .cats .pill.on { background: var(--c-food); color: #fff; }
  .opts { margin-top: 12px; border-radius: 16px; background: var(--surface-2); }
  .opt { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; font-size: 16px; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; border-top: .5px solid var(--separator); }
  .opt [data-i] { width: 20px; height: 20px; color: var(--label-2); }
  .opt .v { margin-left: auto; color: var(--label-2); display: flex; align-items: center; gap: 4px; }
  .opt .v b { color: var(--tint-text); font-weight: 600; }
  .kb { position: absolute; left: 0; right: 0; bottom: 0; height: 252px; background: var(--surface-2); padding: 8px 6px 34px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .k { border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 25px; font-weight: 400; box-shadow: 0 1px 0 rgba(0,0,0,.12); }
  .k.ghost { background: transparent; box-shadow: none; }
  .dark .k { background: #3A3836; }
</style></head>
<body class="canvas">
<div class="iphone">
  <div class="behind"><div class="glow"></div></div>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <div class="seg" style="width:236px"><div class="on">Expense</div><div>Income</div><div>Invest</div></div>
      <div class="gbtn glass tinted"><i data-i="checkmark"></i></div>
    </div>
    <div class="wrap">
      <div class="amount">
        <div class="v num"><span class="cur">$</span>74.40<span class="caret"></span></div>
        <span class="cad">CAD</span>
      </div>
      <div class="note">Dinner with friends</div>
      <div class="cats">
        <span class="pill on"><i data-i="cafe"></i>Food</span>
        <span class="pill"><i data-i="basket"></i>Groceries</span>
        <span class="pill"><i data-i="bus"></i>Transport</span>
        <span class="pill"><i data-i="ellipsis-horizontal"></i></span>
      </div>
      <div class="opts">
        <div class="opt"><i data-i="calendar"></i>Date<span class="v">Today</span></div>
        <div class="opt"><i data-i="card"></i>Account<span class="v">Visa</span></div>
        <div class="opt"><i data-i="people"></i>Split<span class="v">3 ways · <b class="num">$24.80</b> yours</span></div>
        <div class="opt"><i data-i="ellipsis-horizontal"></i>Receipt, repeat, trip<span class="v"><i data-i="chevron-forward" class="chev"></i></span></div>
      </div>
    </div>
    <div class="kb">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div>
      <div class="k ghost">.</div><div class="k">0</div><div class="k ghost"><i data-i="chevron-back"></i></div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
