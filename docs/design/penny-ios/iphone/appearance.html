<style>

  .field .cur { width: 2px; height: 22px; background: var(--tint); margin-left: 1px; border-radius: 1px; }
  .seg.in { margin: 0 16px; }

  .opts { display: flex; gap: 10px; margin: 0 16px; background: var(--surface); border-radius: 22px; padding: 18px 12px 14px; }
  .op { flex: 1; text-align: center; font-size: 15px; font-weight: 600; }
  .mini { position: relative; width: 82px; height: 150px; margin: 0 auto 10px; border-radius: 16px; background: #F2F1EE; overflow: hidden; border: 1.5px solid var(--separator); }
  .mini.dk { background: #000; }

  .mini .l1 { left: 9px; top: 22px; width: 44px; height: 11px; background: #16120F; }
  .mini .l2 { left: 9px; top: 38px; width: 30px; height: 5px; background: #A9A49D; }
  .mini .c { left: 7px; right: 7px; top: 54px; height: 28px; background: #fff; border-radius: 7px; }
  .mini .c2 { top: 88px; height: 34px; }
  .mini .tb { left: 7px; right: 7px; bottom: 7px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.85); }
  .mini.dk .l1 { background: #F6F4F1; } .mini.dk .c { background: #1A1918; } .mini.dk .tb { background: rgba(60,58,56,.9); }
  .op .rb { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--label-3); margin: 8px auto 0; display: grid; place-items: center; }
  .op.on .rb { border: 0; background: var(--tint); color: #fff; }

  .gh { padding-top: 18px; }
</style></head>
