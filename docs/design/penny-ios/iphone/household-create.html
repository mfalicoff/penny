<!-- @dsCard group="iPhone" name="Shared · create or join" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Create or join household</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; inset: 0; background: var(--bg); }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 62px; bottom: 6px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .wrap { padding: 0 18px; }
  .icon { width: 72px; height: 72px; border-radius: 22px; background: var(--fill); display: grid; place-items: center; margin: 22px auto 0; }
  .icon [data-i] { width: 36px; height: 36px; }
  h1 { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 14px; }
  .sub { text-align: center; font-size: 15px; color: var(--label-2); margin-top: 6px; line-height: 20px; padding: 0 12px; }
  .lbl { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; margin: 22px 4px 8px; }
  .field { height: 50px; border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; padding: 0 14px; font-size: 17px; }
  .field.focus { box-shadow: 0 0 0 2px var(--tint); background: var(--surface); }
  .group { border-radius: 14px; background: var(--surface-2); }
  .opt { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 16px; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; border-top: .5px solid var(--separator); }
  .opt [data-i] { width: 20px; height: 20px; color: var(--label-2); }
  .opt .v { margin-left: auto; color: var(--label-2); display: flex; gap: 5px; align-items: center; }
  .opt .v [data-i] { width: 14px; height: 14px; }
  .hint { font-size: 13px; color: var(--label-2); margin: 8px 4px 0; line-height: 18px; }
  .cta { position: absolute; left: 20px; right: 20px; bottom: 34px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; }
</style></head>
<body class="canvas">
<div class="iphone">
  <div class="behind"></div><div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <div class="seg" style="width:220px"><div class="on">Create</div><div>Join</div></div>
      <div style="width:44px"></div>
    </div>
    <div class="wrap">
      <div class="icon"><i data-i="home"></i></div>
      <h1>New household</h1>
      <div class="sub">Share rent, bills and groceries. Everyone sees the full expense; your reports count only your share.</div>

      <div class="lbl">Name</div>
      <div class="field focus">Apartment<span style="display:inline-block;width:2px;height:22px;background:var(--tint);margin-left:2px"></span></div>

      <div class="lbl">Details</div>
      <div class="group">
        <div class="opt"><i data-i="cash"></i>Currency<span class="v">CAD <i data-i="lock-closed"></i></span></div>
        <div class="opt"><i data-i="person-add"></i>Invite people<span class="v">After creating</span></div>
      </div>
      <div class="hint">Uses your ledger currency. Everyone who joins must use CAD too.</div>

    </div>
    <div class="cta glass tinted">Create household</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
