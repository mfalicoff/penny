<!-- @dsCard group="iPhone" name="Household picker" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Household picker</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 384px; bottom: 6px; border-radius: 44px; background: var(--bg); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; height: 56px; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .bar .side { width: 96px; display: flex; gap: 8px; } .bar .side.r { justify-content: flex-end; }
  .gh { padding: 18px 32px 7px; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; }
  .gf { padding: 7px 32px 0; font-size: 13px; color: var(--label-2); line-height: 1.4; }
  .glist { background: var(--surface); border-radius: 22px; margin: 0 16px; overflow: hidden; }
  .sr { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 8px 16px; position: relative; font-size: 17px; }
  .sr + .sr::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; border-top: .5px solid var(--separator); }
  .si { width: 30px; height: 30px; border-radius: 8px; background: var(--fill); display: grid; place-items: center; color: var(--label); flex: none; }
  .si [data-i] { width: 18px; height: 18px; --sw: 40px; }
  .sr .tx { flex: 1; min-width: 0; } .sr .tx small { display: block; font-size: 13px; color: var(--label-2); margin-top: 1px; }
  .check { color: var(--tint); margin-left: auto; } .check[data-i] { width: 20px; height: 20px; --sw: 48px; }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="add-expense.html" scrolling="no"></iframe>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar"><div class="side"><div class="glass gbtn"><i data-i="close"></i></div></div><h2>Household</h2><div class="side r"></div></div>
    <div class="glist" style="margin-top:10px">
      <div class="sr"><div class="avatar" style="border:0;font-size:11px">MF</div><div class="tx">Personal<small>Only you</small></div><i data-i="checkmark" class="check"></i></div>
    </div>
    <div class="gf">Your share counts in your spending either way.</div>
    <div class="gh">Split with</div>
    <div class="glist">
      <div class="sr"><div class="si"><i data-i="home"></i></div><div class="tx">Apartment<small>3 members</small></div></div>
      <div class="sr"><div class="si"><i data-i="airplane"></i></div><div class="tx">Lisbon<small>Shared trip · 4 members</small></div></div>
    </div>
    <div class="gf">Everyone in the household sees the full amount. Shared expenses need a connection.</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
