<!-- @dsCard group="iPhone" name="Calendar sheet" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Calendar</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; inset: 0; border: 0; width: 482px; height: 954px; left: -40px; top: -40px; pointer-events: none; }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 62px; bottom: 6px; border-radius: 44px; background: var(--bg); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 14px; }
  .bar h2 [data-i] { width: 18px; height: 18px; color: var(--tint); --sw: 48px; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  .cal { margin: 14px 12px 0; padding: 12px 8px 10px; }
  .wk, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .wk div { font-size: 12px; font-weight: 600; color: var(--label-3); padding-bottom: 6px; }
  .d { height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding-top: 4px; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .d span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .d.future { color: var(--label-3); }
  .d.today span { color: var(--tint-text); font-weight: 700; }
  .d.sel span { background: var(--tint); color: #fff; font-weight: 700; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; }
  .x { background: var(--label-2); } .ex { border: 1.5px solid var(--pending); width: 6px !important; height: 6px !important; } .in { background: var(--income); } .iv { background: var(--invest); }
  .key { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--label-2); margin-top: 6px; }
  .key span { display: inline-flex; align-items: center; gap: 5px; }
  .key i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dayh { display: flex; justify-content: space-between; padding: 20px 22px 8px; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; }
  .list { margin: 0 12px; }
</style></head>
<body class="canvas">
<div class="iphone">
  <iframe class="behind" src="home.html" scrolling="no"></iframe>
  <div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <h2><i data-i="chevron-back"></i>November 2026<i data-i="chevron-forward"></i></h2>
      <div class="glass gcap" style="height:40px;font-size:15px;padding:0 14px">Today</div>
    </div>

    <div class="card cal">
      <div class="wk"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
      <div class="days" id="days"></div>
      <div class="key"><span><i class="x"></i>Spent</span><span><i class="in"></i>Income</span><span><i class="iv"></i>Invested</span><span><i class="ex" style="border:1.5px solid var(--pending)"></i>Scheduled</span></div>
    </div>

    <div class="dayh"><span>Friday, Nov 6</span><span class="num">−$262.00</span></div>
    <div class="list">
      <div class="row"><div class="ic" style="background:var(--invest)"><i data-i="trending-up"></i></div><div class="t"><b>TFSA contribution</b><span>Main chequing · monthly</span></div><div class="amt num inv">$200.00</div></div>
      <div class="row"><div class="ic" style="background:var(--c-transport)"><i data-i="bus"></i></div><div class="t"><b>Transit pass</b><span>Visa · monthly</span></div><div class="amt num">−$62.00</div></div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
<script>
  // Nov 1 2026 is a Sunday; weeks start Monday. Today = Nov 9, selected = Nov 6.
  const marks = { 1: ["x", "in"], 3: ["x"], 5: ["x"], 6: ["x", "iv"], 8: ["x"], 9: ["x"], 15: ["ex"], 18: ["ex"], 22: ["ex"] };
  let html = "<div class='d'></div>".repeat(6);
  for (let d = 1; d <= 30; d++) {
    const cls = ["d", d > 9 ? "future" : "", d === 9 ? "today" : "", d === 6 ? "sel" : ""].join(" ");
    html += `<div class="${cls}"><span>${d}</span><div class="dots">${(marks[d] || []).map((m) => `<i class="${m}"></i>`).join("")}</div></div>`;
  }
  document.getElementById("days").innerHTML = html;
</script>
</body></html>
