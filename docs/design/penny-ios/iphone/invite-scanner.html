<!-- @dsCard group="iPhone" name="Scan invite" viewport="482x954" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Penny · iPhone · Scan invite</title>
<link rel="stylesheet" href="../assets/penny.css"><script src="../assets/icons.js"></script>
<style>
  .behind { position: absolute; inset: 0; background: var(--bg); }
  .scrim { position: absolute; inset: 0; background: var(--dim); z-index: 5; }
  .sheet { position: absolute; left: 6px; right: 6px; top: 62px; bottom: 6px; border-radius: 44px; background: var(--surface); z-index: 10; overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); opacity: .5; margin: 7px auto 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 0; }
  .bar h2 { font-size: 17px; font-weight: 600; }
  .gbtn.plain { background: var(--fill); box-shadow: none; border: 0; }
  /* live camera image: an out-of-focus room behind a phone held up to the lens */
  .cam { position: relative; margin: 18px 16px 0; height: 486px; border-radius: 32px; overflow: hidden;
    background:
      radial-gradient(60% 40% at 18% 12%, rgba(255, 214, 160, .55), transparent 70%),
      radial-gradient(45% 35% at 88% 22%, rgba(140, 170, 200, .45), transparent 70%),
      radial-gradient(70% 50% at 50% 110%, rgba(120, 84, 60, .9), transparent 70%),
      linear-gradient(180deg, #4A4038 0%, #2E2925 55%, #1E1A17 100%); }
  .cam::after { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.35)); }
  /* the other person's phone, slightly tilted, showing the invite */
  .phone { position: absolute; left: 50%; top: 50%; width: 224px; height: 390px; transform: translate(-50%, -50%) rotate(-4deg); border-radius: 34px; background: #121110; box-shadow: 0 0 0 5px #2A2724, 0 20px 40px rgba(0,0,0,.45); z-index: 1; }
  .phone .scr { position: absolute; inset: 7px; border-radius: 28px; background: #F7F6F3; filter: blur(.4px) brightness(.97); }
  .phone .scr .ln { position: absolute; left: 28px; right: 28px; height: 6px; border-radius: 3px; background: #D9D5CE; }
  .qr { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 146px; height: 146px; display: grid; grid-template-columns: repeat(25, 1fr); background: #fff; padding: 8px; border-radius: 10px; }
  .qr i { display: block; } .qr i.on { background: #16120F; }
  /* viewfinder */
  .vf { position: absolute; left: 50%; top: 50%; width: 196px; height: 196px; transform: translate(-50%, -50%); z-index: 2; }
  .vf i { position: absolute; width: 40px; height: 40px; border: 5px solid #fff; filter: drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
  .vf i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 22px; }
  .vf i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 22px; }
  .vf i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 22px; }
  .vf i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 22px; }
  .hint { font-size: 15px; color: var(--label-2); line-height: 21px; text-align: center; margin: 18px 34px 0; }
  .cta { position: absolute; left: 20px; right: 20px; bottom: 34px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; background: var(--fill); }
  .cta [data-i] { width: 20px; height: 20px; }
</style></head>
<body class="canvas">
<div class="iphone">
  <div class="behind"></div><div class="scrim"></div>
  <div class="island"></div>
  <div class="status" style="color:#fff"><span>9:41</span><span class="r"><i data-i="wifi"></i><i data-i="battery-full"></i></span></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="bar">
      <div class="gbtn plain"><i data-i="close"></i></div>
      <h2>Scan invite</h2>
      <div style="width:44px"></div>
    </div>
    <div class="cam">
      <div class="phone"><div class="scr"><span class="ln" style="top:50px;right:80px"></span><span class="ln" style="top:66px;height:10px;right:50px;background:#C9C4BC"></span><div class="qr" id="qr"></div><span class="ln" style="bottom:74px;left:54px;right:54px;height:8px;background:#C9C4BC"></span><span class="ln" style="bottom:40px;left:40px;right:40px;height:30px;border-radius:15px;background:#E4572E;opacity:.85"></span></div></div>
      <div class="vf"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="hint">Point the camera at the invite QR code on the other person's screen.</div>
    <div class="cta"><i data-i="key"></i>Type the code instead</div>
  </div>
  <div class="home-ind"></div>
</div>
<script>
  // A QR-like 25×25 module grid: three finder squares, timing rows and seeded modules.
  (function (el, n) {
    let seed = 0x7F3A9C01;
    const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
    };
    const cells = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      let on = finder(r, c, 0, 0) ?? finder(r, c, 0, n - 7) ?? finder(r, c, n - 7, 0);
      if (on === null) {
        const sep = (r <= 7 && c <= 7) || (r <= 7 && c >= n - 8) || (r >= n - 8 && c <= 7);
        on = sep ? false : r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() > .52;
      }
      cells.push(`<i${on ? ' class="on"' : ""}></i>`);
    }
    el.innerHTML = cells.join("");
  })(document.getElementById("qr"), 25);
</script>
</body></html>
