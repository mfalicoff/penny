# Penny's product page: static assets only, no Worker script.
#   npm run deploy   (builds, then `wrangler deploy`)
# Routes or a custom domain are set in the Cloudflare dashboard or below, never secrets.
name = "penny-site"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[observability]
enabled = false
