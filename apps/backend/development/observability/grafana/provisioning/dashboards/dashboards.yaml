# Dashboards provisioned from ../../dashboards, generated by scripts/grafana-dashboards.mjs
# (MAZ-128). Edit the script and run npm run dashboards:generate, not the JSON.
apiVersion: 1

providers:
  - name: penny
    folder: Penny
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
