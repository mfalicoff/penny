# Generated by scripts/grafana-dashboards.mjs (MAZ-128, MAZ-289): edit the script, not this file.
# Example alert rules for Penny, evaluated by Grafana. They read the provisioned `prometheus`
# and `loki` data sources; thresholds are starting points for a small household server,
# documented in docs/self-hosting/observability.md#alerts. No contact point is provisioned: add one
# (email, ntfy, Slack, ...) under Alerting > Contact points, or alerts only show in Grafana.
#
# Provisioned rules are read-only in the UI. To change one, edit the script, run it and restart
# Grafana. On Grafana Cloud, `node scripts/grafana-dashboards.mjs --push` creates the same rules.
apiVersion: 1
groups:
  - orgId: 1
    name: Penny API
    folder: Penny
    interval: 1m
    rules:
      - uid: penny-api-not-reporting
        title: Penny API not reporting
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: count(max_over_time(target_info{job="penny-backend"}[5m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Penny API has sent no telemetry for 5 minutes.
          description: The API is down, restarting in a loop, or cannot reach its collector. Check `docker compose ps` and the api container logs.
      - uid: penny-api-readiness
        title: Penny API readiness failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(http_server_request_duration_seconds_count{job="penny-backend", http_route="api/ready", http_response_status_code!="200"}[5m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: /api/ready answered non-200 for 2 minutes.
          description: PostgreSQL, the search model or receipt storage is unavailable to the API. See docs/self-hosting/operations.md.
      - uid: penny-api-5xx-ratio
        title: Penny API 5xx error ratio high
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (sum(rate(http_server_request_duration_seconds_count{job="penny-backend", http_route!~"api/(health|ready)", http_response_status_code=~"5.."}[10m])) / sum(rate(http_server_request_duration_seconds_count{job="penny-backend", http_route!~"api/(health|ready)"}[10m]))) and on () sum(increase(http_server_request_duration_seconds_count{job="penny-backend", http_route!~"api/(health|ready)"}[10m])) >= 20
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API requests failed with 5xx over 10 minutes (now {{ humanizePercentage $values.A.Value }}).
          description: Open the Penny API dashboard, Traces row, Failed requests, and follow a trace to its exception type and SQL.
      - uid: penny-api-latency
        title: Penny API p95 latency high
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="penny-backend", http_route!~"api/(health|ready)"}[15m]))) and on () sum(increase(http_server_request_duration_seconds_count{job="penny-backend", http_route!~"api/(health|ready)"}[15m])) >= 20
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency above 2 s for 15 minutes (now {{ humanizeDuration $values.A.Value }}).
          description: Check the p95 latency by route panel, then the Penny database dashboard for pool saturation or slow queries.
  - orgId: 1
    name: Penny background jobs
    folder: Penny
    interval: 1m
    rules:
      - uid: penny-job-lag
        title: Penny background job lagging
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le, penny_job) (rate(penny_job_lag_seconds_bucket{job="penny-backend", penny_job!="recurrence"}[15m])))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [900]
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.penny_job }} work waits more than 15 minutes before a worker claims it.'
          description: Workers are behind or failing. Check the Penny background jobs dashboard for failures and the worker logs.
      - uid: penny-recurrence-lag
        title: Penny recurrences a day late
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(penny_job_lag_seconds_bucket{job="penny-backend", penny_job="recurrence"}[1h])))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [86399]
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Shared recurring expenses are being recorded a day or more late.
          description: The recurrence runner was stopped or keeps failing. See docs/reference/shared-recurrence.md.
      - uid: penny-job-failures
        title: Penny background job failures
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (penny_job) (increase(penny_job_failures_total{job="penny-backend"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.penny_job }} failed more than 5 times in 15 minutes.'
          description: Failed items are retried; persistent failures need attention. The exception type is on the failures panel and the failed worker-pass traces.
      - uid: penny-mail-not-delivering
        title: Penny emails not delivering
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(penny_mail_deliveries_total{job="penny-backend", penny_mail_outcome=~"deferred|failed"}[30m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 5 password reset, invite or verification emails were deferred or failed in 30 minutes.
          description: The SMTP server is unreachable, refusing the login, or rejecting the sender. Check Email__Smtp__* in api.env and the Email outbox row of the Penny background jobs dashboard (docs/self-hosting/email.md).
      - uid: penny-inbound-mail-unauthorized
        title: Penny emailed receipt ingress refusing signatures
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(penny_inbound_mail_ingress_total{job="penny-backend", penny_inbound_mail_outcome=~"unauthorized|recipients_unauthorized"}[15m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 10 unsigned or badly signed emailed receipt requests in 15 minutes.
          description: The Email Worker's PENNY_WEBHOOK_SECRET may differ from InboundMail__WebhookSecret, or something other than the Worker reaches /api/inbound-mail (check the Tunnel or Access policy). Mail is refused with a temporary failure meanwhile (docs/self-hosting/operations.md#emailed-receipts).
      - uid: penny-inbound-mail-render-failing
        title: Penny emailed receipts not converting
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(penny_inbound_mail_results_total{job="penny-backend", penny_inbound_mail_outcome=~"retry|render_unavailable"}[30m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Emailed receipts are waiting for penny-render.
          description: penny-render is down or unreachable on the render network. Messages back off and fail as render_unavailable after four attempts (docs/self-hosting/operations.md#penny-render-is-down).
  - orgId: 1
    name: Penny clients
    folder: Penny
    interval: 5m
    rules:
      - uid: penny-client-crashes
        title: Penny app crashes
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum by (service_name) (count_over_time({service_name=~"penny-web|penny-ios"} | severity_number >= 21 [1h]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service_name }} reported {{ $values.A.Value }} crash(es) in the last hour.'
          description: Open the Penny clients dashboard, Crashes by app version.
