services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: penny
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PENNY_ADMIN_PASSWORD:?}
      PENNY_MIGRATION_PASSWORD: ${PENNY_MIGRATION_PASSWORD:?}
      PENNY_RUNTIME_PASSWORD: ${PENNY_RUNTIME_PASSWORD:?}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - penny-postgres:/var/lib/postgresql
      - ./development/init-roles.sh:/docker-entrypoint-initdb.d/10-penny-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d penny"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  penny-postgres:
