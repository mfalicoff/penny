services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_DB: penny
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PENNY_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - penny-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d penny"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  penny-postgres:
