name: PR title

# PRs are squash-merged, so the title becomes the commit Release Please reads. `edited`
# reruns the check when only the title changes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Node built-ins only: no install. The title goes through the environment so it is
      # never interpolated into the shell.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/pr-title.mjs
