name: Backend foundation

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Restore exact dependency graph
        run: dotnet restore Penny.Backend.slnx --locked-mode
      - name: Restore pinned CSharpier tool
        run: dotnet tool restore
      - name: Check CSharpier formatting
        run: dotnet csharpier check .
      - name: Check analyzers
        run: dotnet format analyzers Penny.Backend.slnx --verify-no-changes --no-restore
      - name: Compile with warnings as errors
        run: dotnet build Penny.Backend.slnx --no-restore --configuration Release

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Restore exact dependency graph
        run: dotnet restore Penny.Backend.slnx --locked-mode
      - name: Build integration tests
        run: dotnet build Penny.Backend.slnx --no-restore --configuration Release
      - name: Run real HTTP integration tests
        run: dotnet test Penny.Backend.IntegrationTests/Penny.Backend.IntegrationTests.csproj --configuration Release --no-build --no-restore
