name: Build Android APK

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# All builds share one app identity and remote version counter.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Check EAS setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret. See docs/android-apk.md."
            exit 1
          fi
          if ! jq -e '.expo.extra.eas.projectId | strings | select(length > 0)' app.json > /dev/null; then
            echo "::error::Run npx eas-cli@latest init and commit the updated app.json. See docs/android-apk.md."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build on EAS with the existing signing key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build \
            --platform android \
            --profile apk \
            --non-interactive \
            --freeze-credentials \
            --wait \
            --json > "$RUNNER_TEMP/eas-build.json"

      - name: Download the completed APK
        run: |
          apk_url=$(jq -er '
            if length == 1 and .[0].status == "FINISHED" and .[0].platform == "ANDROID"
            then .[0].artifacts.buildUrl | strings | select(startswith("https://"))
            else error("EAS did not return a completed Android build") end
          ' "$RUNNER_TEMP/eas-build.json")
          mkdir -p artifacts
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$apk_url" --output artifacts/penny.apk
          # AABs and error pages must not be published as installable APKs.
          unzip -l artifacts/penny.apk AndroidManifest.xml
          (cd artifacts && sha256sum penny.apk > penny.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: penny-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/penny.apk*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
