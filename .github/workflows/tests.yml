name: Repository tooling and contracts

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # scripts/ is its own package. The golden fixtures and the shared ledger rules' tests run
    # with the web app (web.yml).
    name: Repository tooling and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Validate API contract
        run: npm exec --yes --package @redocly/cli@2.76.0 -- redocly lint ../contracts/openapi.json

      - name: Grafana dashboards are current
        run: npm run dashboards:check

      - name: Run tooling tests
        run: npm test
