name: Product page checks

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/site.yml'
  push:
    branches: [master]
    paths:
      - 'apps/site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    # The static product page. Deploying is manual (`npm run deploy` by the operator, see
    # apps/site/README.md); CI never holds Cloudflare credentials.
    name: Product page lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy dry run
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
