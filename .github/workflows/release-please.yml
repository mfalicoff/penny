name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-please-master
  cancel-in-progress: false

jobs:
  release:
    name: Update release PR or publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A dedicated token lets generated PRs, tags, and releases trigger the
      # validation and build workflows; GITHUB_TOKEN suppresses those events.
      - name: Check release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Add the RELEASE_PLEASE_TOKEN repository secret. See docs/releases.md#one-time-github-setup."
            exit 1
          fi

      - name: Update release PR or publish release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
